# Optional external Prometheus; mount a token file matching ECHOMIND_METRICS_TOKEN.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: flowforge
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/flowforge-token
    static_configs:
      - targets: ['echomind:8000']
