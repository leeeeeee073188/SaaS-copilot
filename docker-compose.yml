services:
  echomind:
    build: .
    env_file: .env
    environment:
      ECHOMIND_DEMO_DATA: /app/data/flowforge
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - flowforge-data:/app/data/flowforge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      echomind:
        condition: service_healthy
    restart: unless-stopped
volumes:
  flowforge-data:
